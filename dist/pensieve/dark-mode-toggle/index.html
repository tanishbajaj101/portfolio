/_astro/client.4JMQrkGS.js" props="{&quot;post&quot;:[0,{&quot;title&quot;:[0,&quot;Dark Mode Toggle&quot;],&quot;description&quot;:[0,&quot;Dark mode without the flash of default theme&quot;],&quot;date&quot;:[0,&quot;2021-04-21&quot;],&quot;draft&quot;:[0,false],&quot;tags&quot;:[1,[[0,&quot;Theming&quot;],[0,&quot;Dark Mode&quot;]]],&quot;body&quot;:[0,&quot;Dark mode toggle without the flash of default theme. Important bits:\r\n\r\n- CSS variables for color theming\r\n- Put `data-theme` attribute on `&lt;html&gt;`, not `&lt;body&gt;`, so we can run the JS before the DOM finishes rendering\r\n- Run local storage check in the `&lt;head&gt;`\r\n- JS for toggle button click handler can come after render\r\n\r\n## HTML\r\n\r\n```html\r\n&lt;!DOCTYPE html&gt;\r\n&lt;html lang=\&quot;en\&quot; data-theme=\&quot;light\&quot;&gt;\r\n  &lt;head&gt;\r\n    &lt;meta charset=\&quot;utf-8\&quot; /&gt;\r\n    &lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width, initial-scale=1.0\&quot; /&gt;\r\n    ...\r\n    &lt;script&gt;\r\n      // If there&#39;s a theme stored in localStorage, use it on the &lt;html&gt;\r\n      const localStorageTheme = localStorage.getItem(&#39;theme&#39;);\r\n      if (localStorageTheme) {\r\n        document.documentElement.setAttribute(&#39;data-theme&#39;, localStorageTheme);\r\n      }\r\n    &lt;/script&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;div class=\&quot;theme-toggle\&quot;&gt;\r\n      &lt;button\r\n        class=\&quot;theme-toggle-btn js-theme-toggle\&quot;\r\n        aria-label=\&quot;Activate dark mode\&quot;\r\n        title=\&quot;Activate dark mode\&quot;\r\n      &gt;\r\n        &lt;!--\r\n        &lt;svg class=\&quot;light-mode\&quot;&gt;\r\n          &lt;use xlink:href=\&quot;#sun\&quot;&gt;&lt;/use&gt;\r\n        &lt;/svg&gt;\r\n        &lt;svg class=\&quot;dark-mode\&quot;&gt;\r\n          &lt;use xlink:href=\&quot;#moon\&quot;&gt;&lt;/use&gt;\r\n        &lt;/svg&gt;\r\n        --&gt;\r\n      &lt;/button&gt;\r\n    &lt;/div&gt;\r\n\r\n    &lt;script src=\&quot;app.js\&quot;&gt;&lt;/script&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;\r\n```\r\n\r\n## CSS Variables\r\n\r\n```css\r\n:root {\r\n  --bg: #ffffff;\r\n  --text: #000000;\r\n}\r\n\r\n[data-theme=&#39;dark&#39;] {\r\n  --bg: #000000;\r\n  --text: #ffffff;\r\n}\r\n```\r\n\r\n## JavaScript\r\n\r\n```js:title=app.js\r\nconst themeToggleBtn = document.querySelector(&#39;.js-theme-toggle&#39;);\r\n\r\nthemeToggleBtn.addEventListener(&#39;click&#39;, () =&gt; onToggleClick());\r\n\r\nconst onToggleClick = () =&gt; {\r\n  const { theme } = document.documentElement.dataset;\r\n  const themeTo = theme &amp;&amp; theme === &#39;light&#39; ? &#39;dark&#39; : &#39;light&#39;;\r\n  const label = `Activate ${theme} mode`;\r\n\r\n  document.documentElement.setAttribute(&#39;data-theme&#39;, themeTo);\r\n  localStorage.setItem(&#39;theme&#39;, themeTo);\r\n\r\n  themeToggleBtn.setAttribute(&#39;aria-label&#39;, label);\r\n  themeToggleBtn.setAttribute(&#39;title&#39;, label);\r\n};\r\n```\r\n\r\n## Resources\r\n\r\n- &lt;https://css-tricks.com/a-complete-guide-to-dark-mode-on-the-web/&gt;\r\n- &lt;https://css-tricks.com/flash-of-inaccurate-color-theme-fart/&gt;\r\n- &lt;https://mxb.dev/blog/color-theme-switcher/&gt;\r\n- &lt;https://www.joshwcomeau.com/react/dark-mode/&gt;\r\n- &lt;https://web.dev/prefers-color-scheme/&gt;&quot;],&quot;slug&quot;:[0,&quot;/pensieve/dark-mode-toggle&quot;]}],&quot;pathname&quot;:[0,&quot;/pensieve/dark-mode-toggle&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostPage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
