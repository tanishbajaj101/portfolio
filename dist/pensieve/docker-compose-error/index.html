 was coming from the `-w` flag in the `docker-compose exec` command in the `composer` script.\r\n\r\n## Solution\r\n\r\nTurns The fix was to update the version in my `docker-compose.yml` file to from version `3.5` to `3.6`. It&#39;s strange because 3.5 isn&#39;t anywhere close to the API version `1.35` from the error message 🤷‍♀️\r\n\r\n```yaml:title=docker-compose.yml\r\nversion: &#39;3.6&#39; # highlight-line\r\nservices:\r\n  wordpress:\r\n    build:\r\n```&quot;],&quot;slug&quot;:[0,&quot;/pensieve/docker-compose-error&quot;]}],&quot;pathname&quot;:[0,&quot;/pensieve/docker-compose-error&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostPage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
